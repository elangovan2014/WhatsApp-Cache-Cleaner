name = "WhatsAppCacheCleaner"
summary = "WhatsApp Cache Cleaner"
description = "Keyboard-accessible WhatsApp cache scanner and cleaner for NVDA users. Use the numbered buttons to scan recognised cache folders, check whether WhatsApp-related processes are running, and clean recognised cache folders after confirmation. Announces scan, process-check, and cleanup results through NVDA speech. Protects chats, account and session data, cookies, and other unlisted folders. Does not force-close applications or bypass Windows permissions."
